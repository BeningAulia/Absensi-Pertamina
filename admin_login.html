{% extends "base.html" %}
{% block page_title %}Login Admin{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
    <h2 style="text-align: center; margin-bottom: 24px; color: var(--pr-blue-dark);">
        <i class="fas fa-lock"></i> Login Admin
    </h2>

    {% if not admin_exists %}
        <div style="text-align: center; margin-bottom: 20px;">
            <p style="color: var(--text-muted);">Belum ada akun admin.</p>
            <a href="/admin/register" class="btn btn-outline btn-sm">
                <i class="fas fa-user-shield"></i> Daftarkan Admin
            </a>
        </div>
    {% else %}
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt"></i> Masuk
            </button>
        </form>
    {% endif %}
</div>
{% endblock %}
